<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmaMastery – PT New Staff Module I</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #19478C;
    --teal: #009CA2;
    --sky: #3EB3E1;
    --sky-light: #e8f7fd;
    --sky-mid: #b8e4f5;
    --white: #ffffff;
    --off-white: #f5fafd;
    --text-dark: #0d2a50;
    --text-mid: #3a5a80;
    --text-muted: #7a9ab8;
    --success: #009CA2;
    --fail: #c94040;
    --border: rgba(25,71,140,0.12);
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 2px 16px rgba(25,71,140,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #d6eef8;
    min-height: 100vh;
    color: var(--text-dark);
  }

  /* ---- SCREENS ---- */
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  /* ---- LOGIN ---- */
  #screen-login {
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #3EB3E1 0%, #19478C 100%);
    padding: 2rem;
  }
  .login-card {
    background: white;
    border-radius: 24px;
    padding: 3rem 2.5rem;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 8px 40px rgba(25,71,140,0.18);
  }
  .login-logo {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, var(--sky) 0%, var(--navy) 100%);
    border-radius: 50%;
    margin: 0 auto 1.5rem;
    display: flex; align-items: center; justify-content: center;
  }
  .login-logo svg { width: 36px; height: 36px; fill: white; }
  .login-card h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.8rem;
    color: var(--navy);
    margin-bottom: 0.4rem;
  }
  .login-card .subtitle {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-bottom: 2rem;
  }
  .login-card input {
    width: 100%;
    padding: 0.85rem 1.2rem;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 1rem;
    font-family: 'DM Sans', sans-serif;
    color: var(--text-dark);
    background: var(--off-white);
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 1.2rem;
  }
  .login-card input:focus { border-color: var(--sky); }
  .btn-primary {
    width: 100%;
    padding: 0.9rem;
    background: linear-gradient(135deg, var(--sky) 0%, var(--navy) 100%);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 1rem;
    font-weight: 600;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    letter-spacing: 0.02em;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:active { transform: scale(0.98); }
  .error-msg { color: var(--fail); font-size: 0.85rem; margin-bottom: 0.8rem; }
  .role-label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.6rem; text-align: left; }
  .role-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 1.2rem; }
  .role-btn {
    padding: 0.75rem;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--off-white);
    font-size: 1rem;
    font-weight: 700;
    font-family: 'DM Sans', sans-serif;
    color: var(--text-mid);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.05em;
  }
  .role-btn:hover { border-color: var(--sky); background: var(--sky-light); }
  .role-btn.active { border-color: var(--navy); background: rgba(25,71,140,0.07); color: var(--navy); }

  /* ---- DASHBOARD ---- */
  #screen-dashboard {
    background: var(--sky-light);
    padding: 0;
  }
  .dash-header {
    background: linear-gradient(135deg, var(--navy) 0%, #2160a8 100%);
    padding: 1.5rem 1.5rem 2.5rem;
    color: white;
    position: relative;
    overflow: hidden;
  }
  .dash-header::after {
    content: '';
    position: absolute;
    bottom: -30px; left: -20px; right: -20px;
    height: 60px;
    background: var(--sky-light);
    border-radius: 50%;
  }
  .dash-header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.2rem;
  }
  .dash-greeting {
    font-family: 'DM Serif Display', serif;
    font-size: 1.4rem;
  }
  .dash-greeting span { color: var(--sky); }
  .btn-leaderboard {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    border-radius: 20px;
    padding: 0.4rem 1rem;
    font-size: 0.8rem;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    font-weight: 500;
  }
  .dash-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.8rem;
    position: relative;
    z-index: 1;
  }
  .stat-pill {
    background: rgba(255,255,255,0.15);
    border-radius: var(--radius-sm);
    padding: 0.7rem;
    text-align: center;
    backdrop-filter: blur(4px);
  }
  .stat-pill .val { font-size: 1.5rem; font-weight: 700; line-height: 1; }
  .stat-pill .lbl { font-size: 0.7rem; opacity: 0.8; margin-top: 2px; }

  .dash-body { padding: 1.5rem; padding-top: 2rem; flex: 1; }
  .dash-section-title {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 0.8rem;
  }
  .topic-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.8rem;
    margin-bottom: 1.5rem;
  }
  .topic-card {
    background: white;
    border-radius: var(--radius);
    padding: 1rem;
    cursor: pointer;
    border: 1.5px solid transparent;
    transition: all 0.2s;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .topic-card:hover { border-color: var(--sky); transform: translateY(-2px); }
  .topic-card.passed { border-color: rgba(0,156,162,0.3); }
  .topic-card.in-progress { border-color: rgba(62,179,225,0.4); }
  .topic-card .status-icon {
    font-size: 1.2rem;
    margin-bottom: 0.5rem;
    display: block;
  }
  .topic-card .topic-name {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--text-dark);
    line-height: 1.3;
    margin-bottom: 0.4rem;
  }
  .topic-card .topic-meta {
    font-size: 0.72rem;
    color: var(--text-muted);
  }
  .topic-card .pb-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 0.6rem;
    overflow: hidden;
  }
  .topic-card .pb-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--sky), var(--teal));
    border-radius: 2px;
    transition: width 0.5s ease;
  }
  .op-badge {
    position: absolute;
    top: 8px; right: 8px;
    background: rgba(62,179,225,0.15);
    color: var(--sky);
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 2px 6px;
    border-radius: 4px;
  }

  /* ---- QUIZ ---- */
  #screen-quiz {
    background: white;
    min-height: 100vh;
  }
  .quiz-header {
    background: var(--navy);
    padding: 1rem 1.2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    color: white;
  }
  .quiz-back {
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
  }
  .quiz-header-info { flex: 1; }
  .quiz-header-info .topic-title { font-size: 0.9rem; font-weight: 600; }
  .quiz-header-info .q-counter { font-size: 0.75rem; opacity: 0.7; margin-top: 1px; }
  .quiz-progress-bar {
    height: 3px;
    background: rgba(255,255,255,0.2);
    position: relative;
  }
  .quiz-progress-fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    background: var(--sky);
    transition: width 0.3s ease;
  }
  .quiz-body {
    padding: 1.5rem;
    flex: 1;
    overflow-y: auto;
  }
  .q-type-badge {
    display: inline-block;
    background: var(--sky-light);
    color: var(--navy);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 4px;
    margin-bottom: 0.8rem;
  }
  .q-text {
    font-size: 1rem;
    line-height: 1.6;
    color: var(--text-dark);
    margin-bottom: 1.5rem;
    font-weight: 500;
  }
  .q-subitems {
    margin-top: 0.6rem;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .q-subitem {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    font-size: 0.92rem;
    font-weight: 400;
    color: var(--text-mid);
    padding: 0.25rem 0.6rem;
    background: var(--sky-light);
    border-left: 3px solid var(--sky-mid);
    border-radius: 0 6px 6px 0;
    line-height: 1.5;
  }
  .q-sub { font-size: 0.85rem; color: var(--text-mid); margin-bottom: 0.5rem; }
  .options-list { display: flex; flex-direction: column; gap: 0.7rem; }
  .option-btn {
    background: var(--off-white);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.9rem 1rem;
    text-align: left;
    cursor: pointer;
    font-size: 0.9rem;
    font-family: 'DM Sans', sans-serif;
    color: var(--text-dark);
    transition: all 0.15s;
    display: flex;
    align-items: flex-start;
    gap: 0.8rem;
    line-height: 1.4;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--sky); background: var(--sky-light); }
  .option-btn.selected { border-color: var(--navy); background: rgba(25,71,140,0.06); }
  .option-key {
    min-width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--text-mid);
    flex-shrink: 0;
    margin-top: 1px;
  }
  .option-btn.selected .option-key {
    background: var(--navy);
    color: white;
  }
  .option-btn:disabled { cursor: default; }
  .mrq-hint { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.5rem; font-style: italic; }

  .quiz-footer {
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border);
    background: white;
  }
  .btn-submit {
    width: 100%;
    padding: 0.9rem;
    background: var(--navy);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 1rem;
    font-weight: 600;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-submit:not(:disabled):hover { background: #2160a8; }

  /* Matching question */
  .match-container { display: flex; flex-direction: column; gap: 0.8rem; }
  .match-row {
    background: var(--off-white);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.8rem;
  }
  .match-row label { font-size: 0.82rem; font-weight: 600; color: var(--text-mid); display: block; margin-bottom: 0.4rem; }
  .match-row select {
    width: 100%;
    padding: 0.5rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    color: var(--text-dark);
    background: white;
  }

  /* True/False */
  .tf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
  .tf-btn {
    padding: 1rem;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: var(--off-white);
    font-size: 1rem;
    font-weight: 600;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--text-dark);
  }
  .tf-btn:hover:not(:disabled) { border-color: var(--sky); background: var(--sky-light); }
  .tf-btn.selected { border-color: var(--navy); background: rgba(25,71,140,0.06); color: var(--navy); }

  /* ---- RESULT ---- */
  #screen-result {
    background: var(--off-white);
    align-items: center;
    padding: 2rem 1.5rem;
  }
  .result-card {
    background: white;
    border-radius: 24px;
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .result-icon {
    width: 80px; height: 80px;
    border-radius: 50%;
    margin: 0 auto 1.2rem;
    display: flex; align-items: center; justify-content: center;
    font-size: 2.2rem;
  }
  .result-icon.pass { background: rgba(0,156,162,0.1); }
  .result-icon.fail { background: rgba(201,64,64,0.08); }
  .result-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.6rem;
    margin-bottom: 0.4rem;
  }
  .result-title.pass { color: var(--teal); }
  .result-title.fail { color: var(--fail); }
  .result-msg { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
  .result-score-ring {
    width: 120px; height: 120px;
    margin: 0 auto 1.5rem;
    position: relative;
  }
  .result-score-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--sky-mid); stroke-width: 8; }
  .ring-fill { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }
  .ring-fill.pass { stroke: var(--teal); }
  .ring-fill.fail { stroke: var(--fail); }
  .result-score-num {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--text-dark);
  }
  .result-pb {
    font-size: 0.8rem;
    color: var(--teal);
    font-weight: 600;
    margin-bottom: 1.5rem;
  }
  .btn-retry {
    width: 100%;
    padding: 0.9rem;
    background: var(--fail);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 1rem;
    font-weight: 600;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    margin-bottom: 0.7rem;
    transition: opacity 0.2s;
  }
  .btn-retry:hover { opacity: 0.85; }
  .btn-back-dash {
    width: 100%;
    padding: 0.9rem;
    background: transparent;
    color: var(--navy);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 1rem;
    font-weight: 600;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-back-dash:hover { background: var(--sky-light); }

  /* ---- LEADERBOARD ---- */
  #screen-leaderboard {
    background: var(--sky-light);
  }
  .lb-header {
    background: var(--navy);
    padding: 1rem 1.2rem;
    display: flex; align-items: center; gap: 1rem;
    color: white;
  }
  .lb-body { padding: 1.5rem; flex: 1; }
  .lb-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.3rem;
    color: var(--navy);
    margin-bottom: 0.3rem;
  }
  .lb-subtitle { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1.2rem; }
  .lb-row {
    background: white;
    border-radius: var(--radius-sm);
    padding: 0.9rem 1rem;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    box-shadow: var(--shadow);
  }
  .lb-rank {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-muted);
    min-width: 28px;
    text-align: center;
  }
  .lb-rank.gold { color: #c9960a; }
  .lb-rank.silver { color: #7a8ea8; }
  .lb-rank.bronze { color: #a0622a; }
  .lb-name { flex: 1; font-weight: 500; font-size: 0.9rem; }
  .lb-name.me { color: var(--navy); font-weight: 700; }
  .lb-score { font-size: 0.9rem; font-weight: 700; color: var(--teal); }
  .lb-topics { font-size: 0.72rem; color: var(--text-muted); }
  .lb-empty { text-align: center; color: var(--text-muted); font-size: 0.9rem; padding: 2rem; }

  /* Formulation metaphor */
  .formulation-bar {
    background: white;
    border-radius: var(--radius);
    padding: 1rem 1rem 0.8rem;
    margin-bottom: 1rem;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .form-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.5rem;
  }
  .form-header-title { font-size: 0.78rem; font-weight: 600; color: var(--text-mid); }
  .form-header-pct { font-size: 0.78rem; font-weight: 700; color: var(--teal); }
  #formulation-svg { display: block; width: 100%; }

  @media (max-width: 400px) {
    .topic-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="screen-login" class="screen active">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/></svg>
    </div>
    <h1>PharmaMastery</h1>
    <p class="subtitle">PT New Staff Module I – Self-Paced Learning</p>
    <input type="text" id="login-name" placeholder="Enter your full name" autocomplete="name" />
    <div class="role-label">I am a...</div>
    <div class="role-toggle">
      <button class="role-btn" id="role-op" onclick="selectRole('OP')">OP</button>
      <button class="role-btn" id="role-psc" onclick="selectRole('PSC')">PSC</button>
    </div>
    <div id="login-error" class="error-msg" style="display:none">Please enter your full name and select a role.</div>
    <button class="btn-primary" onclick="doLogin()">Begin My Journey</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="screen-dashboard" class="screen">
  <div class="dash-header">
    <div class="dash-header-top">
      <div class="dash-greeting">Hello, <span id="dash-name"></span></div>
      <button class="btn-leaderboard" onclick="showLeaderboard()">🏆 Rankings</button>
    </div>
    <div class="dash-stats">
      <div class="stat-pill"><div class="val" id="stat-completed">0</div><div class="lbl">Completed</div></div>
      <div class="stat-pill"><div class="val" id="stat-total">12</div><div class="lbl">Topics</div></div>
      <div class="stat-pill"><div class="val" id="stat-avg">—</div><div class="lbl">Best Avg</div></div>
    </div>
  </div>
  <div class="dash-body">
    <div class="formulation-bar">
      <div class="form-header">
        <span class="form-header-title">Formulation Journey</span>
        <span class="form-header-pct" id="form-pct-label">0%</span>
      </div>
      <svg id="formulation-svg" viewBox="0 0 340 110" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="dash-section-title">Core Topics</div>
    <div class="topic-grid" id="topic-grid-core"></div>
    <div id="op-section">
      <div class="dash-section-title">OP-Only Topics</div>
      <div class="topic-grid" id="topic-grid-op"></div>
    </div>
  </div>
</div>

<!-- QUIZ -->
<div id="screen-quiz" class="screen">
  <div class="quiz-header">
    <button class="quiz-back" onclick="backToDashboard()">←</button>
    <div class="quiz-header-info">
      <div class="topic-title" id="quiz-topic-title"></div>
      <div class="q-counter" id="quiz-q-counter"></div>
    </div>
  </div>
  <div class="quiz-progress-bar"><div class="quiz-progress-fill" id="quiz-progress-fill"></div></div>
  <div class="quiz-body" id="quiz-body"></div>
  <div class="quiz-footer">
    <button class="btn-submit" id="btn-submit" onclick="submitAnswer()" disabled>Submit Answer</button>
  </div>
</div>

<!-- RESULT -->
<div id="screen-result" class="screen">
  <div class="result-card">
    <div class="result-icon" id="result-icon"></div>
    <div class="result-title" id="result-title"></div>
    <div class="result-msg" id="result-msg"></div>
    <div class="result-score-ring">
      <svg viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="52"/>

// ---- STATE ----
let state = {
  name: '',
  progress: {}, // topicId -> { passed, bestScore, attempts }
};

function loadState() {
  try {
    const saved = localStorage.getItem('pharmamastery_state');
    if (saved) state = JSON.parse(saved);
  } catch(e) {}
}

function saveState() {
  try {
    localStorage.setItem('pharmamastery_state', JSON.stringify(state));
  } catch(e) {}
}

// ---- QUIZ STATE ----
let quizState = {};

// ---- SCREENS ----
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

// ---- LOGIN ----
let selectedRole = null;

function selectRole(role) {
  selectedRole = role;
  document.getElementById('role-op').classList.toggle('active', role === 'OP');
  document.getElementById('role-psc').classList.toggle('active', role === 'PSC');
}

function doLogin() {
  const name = document.getElementById('login-name').value.trim();
  if (!name || name.split(' ').filter(w=>w).length < 2 || !selectedRole) {
    document.getElementById('login-error').style.display = 'block';
    return;
  }
  document.getElementById('login-error').style.display = 'none';
  state.name = name;
  state.role = selectedRole;
  saveState();
  showDashboard();
}

document.getElementById('login-name').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });

// ---- DASHBOARD ----
function showDashboard() {
  updateDashboard();
  showScreen('dashboard');
}

function updateDashboard() {
  const firstName = state.name.split(' ')[0];
  document.getElementById('dash-name').textContent = firstName;

  const isOP = state.role === 'OP';
  const visibleTopics = TOPICS.filter(t => isOP || !t.opOnly);
  const core = visibleTopics.filter(t => !t.opOnly);

  let completed = 0, scoreSum = 0, scoreCt = 0;
  for (const t of visibleTopics) {
    const p = state.progress[t.id];
    if (p && p.passed) completed++;
  }
  for (const t of core) {
    const p = state.progress[t.id];
    if (p && p.bestScore != null) { scoreSum += p.bestScore; scoreCt++; }
  }
  const avg = scoreCt > 0 ? Math.round(scoreSum / scoreCt) + '%' : '—';

  document.getElementById('stat-completed').textContent = completed;
  document.getElementById('stat-total').textContent = visibleTopics.length;
  document.getElementById('stat-avg').textContent = avg;

  let roleBadgeEl = document.getElementById('dash-role-badge');
  if (!roleBadgeEl) {
    roleBadgeEl = document.createElement('span');
    roleBadgeEl.id = 'dash-role-badge';
    roleBadgeEl.style.cssText = 'display:inline-block;background:rgba(255,255,255,0.2);border-radius:6px;padding:2px 8px;font-size:0.72rem;font-weight:700;letter-spacing:0.06em;margin-left:8px;vertical-align:middle;';
    document.querySelector('.dash-greeting').appendChild(roleBadgeEl);
  }
  roleBadgeEl.textContent = state.role;

  drawFormulationPipeline(completed, visibleTopics.length);

  renderTopicGrid('topic-grid-core', core);
  const opSection = document.getElementById('op-section');
  const opTopics = TOPICS.filter(t => t.opOnly);
  if (isOP) {
    opSection.style.display = '';
    renderTopicGrid('topic-grid-op', opTopics);
  } else {
    opSection.style.display = 'none';
  }
}

function drawFormulationPipeline(completed, total) {
  const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
  document.getElementById('form-pct-label').textContent = pct + '% complete';

  const svg = document.getElementById('formulation-svg');

  // 4 stages of the formulation journey
  const stages = [
    { label: 'Raw\nIngredients', icon: 'grain',   threshold: 0   },
    { label: 'Measured\nCompounds',  icon: 'measure', threshold: 0.25 },
    { label: 'Mixed\nFormulation',   icon: 'mix',     threshold: 0.55 },
    { label: 'Final\nProduct',       icon: 'product', threshold: 0.85 },
  ];

  // Colors
  const C_ACTIVE_BG   = '#e8f7fd';
  const C_ACTIVE_STR  = '#3EB3E1';
  const C_DONE_BG     = '#e1f5ee';
  const C_DONE_STR    = '#009CA2';
  const C_IDLE_BG     = '#f0f4f8';
  const C_IDLE_STR    = '#c5d5e4';
  const C_ICON_ACTIVE = '#19478C';
  const C_ICON_DONE   = '#007a7f';
  const C_ICON_IDLE   = '#b0c4d8';
  const C_TEXT_ACTIVE = '#0d2a50';
  const C_TEXT_IDLE   = '#9ab5cc';
  const C_PIPE_DONE   = '#3EB3E1';
  const C_PIPE_IDLE   = '#dde8f0';

  const ratio = completed / total;

  // Stage state: 'done' | 'active' | 'idle'
  function stageState(i) {
    const next = stages[i + 1];
    if (next && ratio >= next.threshold) return 'done';
    if (ratio >= stages[i].threshold) return 'active';
    return 'idle';
  }

  // Layout: 4 circles + 3 connectors across 340px wide, centered
  const CX = [36, 118, 206, 294]; // circle centres x
  const CY = 44;
  const R  = 26;

  // Particles inside each stage icon (drawn as simple geometric shapes)
  function iconPath(type, cx, cy) {
    const ico = { stroke: 'none', fill: C_ICON_IDLE };
    if (type === 'grain') {
      // Three small dots = raw powder
      return `
        <circle cx="${cx-8}" cy="${cy+2}" r="4"/>
        <circle cx="${cx+1}" cy="${cy-5}" r="3"/>
        <circle cx="${cx+8}" cy="${cy+4}" r="3.5"/>`;
    }
    if (type === 'measure') {
      // Beaker outline
      return `<path d="M${cx-7},${cy-7} L${cx-7},${cy+2} L${cx-12},${cy+9} L${cx+12},${cy+9} L${cx+7},${cy+2} L${cx+7},${cy-7}" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="${cx-4}" y1="${cy-7}" x2="${cx+4}" y2="${cy-7}" stroke-width="1.5" stroke-linecap="round"/>`;
    }
    if (type === 'mix') {
      // Stirrer / spiral
      return `<path d="M${cx},${cy-8} C${cx+9},${cy-5} ${cx+9},${cy+5} ${cx},${cy+8} C${cx-9},${cy+5} ${cx-9},${cy-5} ${cx},${cy-8}" fill="none" stroke-width="2"/>
              <circle cx="${cx}" cy="${cy}" r="2.5"/>`;
    }
    if (type === 'product') {
      // Pill capsule
      return `<rect x="${cx-10}" y="${cy-5}" width="20" height="10" rx="5"/>
              <line x1="${cx}" y1="${cy-5}" x2="${cx}" y2="${cy+5}" stroke-width="1" stroke="white"/>`;
    }
    return '';
  }

  let out = `<svg id="formulation-svg" viewBox="0 0 340 110" xmlns="http://www.w3.org/2000/svg">`;

  // Stage labels & connectors (drawn first, behind circles)
  for (let i = 0; i < 4; i++) {
    const state = stageState(i);

    // Connector pipe to next stage
    if (i < 3) {
      const x1 = CX[i] + R, x2 = CX[i+1] - R;
      const mid = (x1 + x2) / 2;
      // Pipe fill based on whether next stage is reached
      const nextState = stageState(i + 1);
      const pipeColor = (nextState === 'done' || nextState === 'active') ? C_PIPE_DONE : C_PIPE_IDLE;
      // Animated fill width if currently filling into next stage
      out += `<rect x="${x1}" y="${CY-4}" width="${x2-x1}" height="8" rx="4" fill="${C_PIPE_IDLE}"/>`;
      if (nextState !== 'idle') {
        out += `<rect x="${x1}" y="${CY-4}" width="${x2-x1}" height="8" rx="4" fill="${pipeColor}"/>`;
      }
      // Flow arrow chevron
      const arrowColor = nextState !== 'idle' ? C_PIPE_DONE : C_PIPE_IDLE;
      out += `<path d="M${mid-4},${CY-4} L${mid+4},${CY} L${mid-4},${CY+4}" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
  }

  // Stage circles
  for (let i = 0; i < 4; i++) {
    const st = stageState(i);
    const bg  = st === 'done' ? C_DONE_BG  : st === 'active' ? C_ACTIVE_BG  : C_IDLE_BG;
    const str = st === 'done' ? C_DONE_STR : st === 'active' ? C_ACTIVE_STR : C_IDLE_STR;
    const iconColor = st === 'done' ? C_ICON_DONE : st === 'active' ? C_ICON_ACTIVE : C_ICON_IDLE;
    const labelColor = st === 'idle' ? C_TEXT_IDLE : C_TEXT_ACTIVE;

    // Circle
    out += `<circle cx="${CX[i]}" cy="${CY}" r="${R}" fill="${bg}" stroke="${str}" stroke-width="2"/>`;

    // Done checkmark
    if (st === 'done') {
      out += `<path d="M${CX[i]-9},${CY} L${CX[i]-3},${CY+7} L${CX[i]+10},${CY-8}" fill="none" stroke="${C_ICON_DONE}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    } else {
      // Icon shape
      const iconEl = iconPath(stages[i].icon, CX[i], CY);
      out += `<g stroke="${iconColor}" fill="${iconColor}">${iconEl}</g>`;
    }

    // Stage number badge
    const badgeColor = st === 'idle' ? C_IDLE_STR : st === 'done' ? C_DONE_STR : C_ACTIVE_STR;
    out += `<circle cx="${CX[i]+20}" cy="${CY-20}" r="9" fill="${badgeColor}"/>`;
    out += `<text x="${CX[i]+20}" y="${CY-16}" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="9" font-weight="700" fill="white">${i+1}</text>`;

    // Label lines
    const lines = stages[i].label.split('\n');
    const labelY = CY + R + 14;
    out += `<text x="${CX[i]}" y="${labelY}" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="9.5" font-weight="600" fill="${labelColor}">${lines[0]}</text>`;
    if (lines[1]) {
      out += `<text x="${CX[i]}" y="${labelY+12}" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="9.5" font-weight="600" fill="${labelColor}">${lines[1]}</text>`;
    }
  }

  // Overall progress bar at bottom
  const barX = 10, barY = 96, barW = 320, barH = 7;
  const fillW = Math.round((pct / 100) * barW);
  out += `<rect x="${barX}" y="${barY}" width="${barW}" height="${barH}" rx="3.5" fill="${C_IDLE_BG}"/>`;
  if (fillW > 0) {
    out += `<rect x="${barX}" y="${barY}" width="${fillW}" height="${barH}" rx="3.5" fill="${C_ACTIVE_STR}"/>`;
  }

  out += `</svg>`;
  svg.outerHTML = out;
}

function renderTopicGrid(containerId, topics) {
  const grid = document.getElementById(containerId);
  grid.innerHTML = '';
  for (const t of topics) {
    const p = state.progress[t.id] || {};
    let statusIcon = '⬜';
    let cardClass = '';
    if (p.passed) { statusIcon = '✅'; cardClass = 'passed'; }
    else if (p.attempts > 0) { statusIcon = '🔄'; cardClass = 'in-progress'; }

    const card = document.createElement('div');
    card.className = 'topic-card ' + cardClass;
    card.onclick = () => startTopic(t.id);

    const qCount = (QUESTION_BANK[t.id] || []).length;
    const pb = p.bestScore != null ? p.bestScore : null;

    card.innerHTML = `
      ${t.opOnly ? '<div class="op-badge">OP Only</div>' : ''}
      <span class="status-icon">${statusIcon}</span>
      <div class="topic-name">${t.name}</div>
      <div class="topic-meta">${qCount} question${qCount!==1?'s':''} · ${pb != null ? 'Best: '+pb+'%' : 'Not attempted'}</div>
      <div class="pb-bar"><div class="pb-fill" style="width:${pb!=null?pb:0}%"></div></div>
    `;
    grid.appendChild(card);
  }
}

// ---- QUIZ ----
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function startTopic(topicId) {
  const topic = TOPICS.find(t => t.id === topicId);
  const rawQs = QUESTION_BANK[topicId] || [];
  const questions = shuffle(rawQs);

  quizState = {
    topicId,
    topicName: topic.name,
    questions,
    currentIdx: 0,
    answers: [],
    score: null,
  };

  document.getElementById('quiz-topic-title').textContent = topic.name;
  renderQuestion();
  showScreen('quiz');
}

function formatQuestionText(text, subitems) {
  let html = `<span>${text}</span>`;
  if (subitems && subitems.length) {
    const itemsHtml = subitems.map(item => `<div class="q-subitem">${item}</div>`).join('');
    html += `<div class="q-subitems">${itemsHtml}</div>`;
  }
  return html;
}

function renderQuestion() {
  const { questions, currentIdx } = quizState;
  const q = questions[currentIdx];
  const total = questions.length;

  document.getElementById('quiz-q-counter').textContent = `Question ${currentIdx+1} of ${total}`;
  document.getElementById('quiz-progress-fill').style.width = ((currentIdx / total) * 100) + '%';
  document.getElementById('btn-submit').disabled = true;

  const body = document.getElementById('quiz-body');
  let typeBadge = 'Multiple Choice';
  if (q.type === 'mrq') typeBadge = 'Select All That Apply';
  else if (q.type === 'tf') typeBadge = 'True / False';

  let html = `<div class="q-type-badge">${typeBadge}</div><div class="q-text">${formatQuestionText(q.q, q.subitems)}</div>`;

  if (q.type === 'mcq' || q.type === 'mrq') {
    const keys = ['A','B','C','D','E','F'];
    html += q.type === 'mrq' ? '<div class="mrq-hint">Select one or more options</div>' : '';
    html += '<div class="options-list" id="options-list">';
    q.options.forEach((opt, i) => {
      html += `<button class="option-btn" onclick="toggleOption(${i})" data-idx="${i}">
        <span class="option-key">${keys[i]}</span>
        <span>${opt}</span>
      </button>`;
    });
    html += '</div>';
  } else if (q.type === 'tf') {
    html += `<div class="tf-row">
      <button class="tf-btn" onclick="selectTF(true)">True</button>
      <button class="tf-btn" onclick="selectTF(false)">False</button>
    </div>`;
  }

  body.innerHTML = html;
  quizState.currentAnswer = q.type === 'mrq' ? [] : null;
}

function toggleOption(idx) {
  const q = quizState.questions[quizState.currentIdx];
  if (q.type === 'mcq') {
    quizState.currentAnswer = idx;
    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
    document.querySelectorAll('.option-btn')[idx].classList.add('selected');
    document.getElementById('btn-submit').disabled = false;
  } else {
    const arr = quizState.currentAnswer;
    const pos = arr.indexOf(idx);
    if (pos === -1) arr.push(idx);
    else arr.splice(pos, 1);
    document.querySelectorAll('.option-btn').forEach((b, i) => {
      b.classList.toggle('selected', arr.includes(i));
    });
    document.getElementById('btn-submit').disabled = arr.length === 0;
  }
}

function selectTF(val) {
  quizState.currentAnswer = val;
  document.querySelectorAll('.tf-btn').forEach(b => {
    b.classList.toggle('selected', (b.textContent === 'True') === val);
  });
  document.getElementById('btn-submit').disabled = false;
}

function submitAnswer() {
  const q = quizState.questions[quizState.currentIdx];
  let isCorrect = false;

  if (q.type === 'mcq') {
    isCorrect = quizState.currentAnswer === q.ans[0];
  } else if (q.type === 'mrq') {
    const given = [...quizState.currentAnswer].sort().join(',');
    const expected = [...q.ans].sort().join(',');
    isCorrect = given === expected;
  } else if (q.type === 'tf') {
    isCorrect = quizState.currentAnswer === q.ans;
  }

  quizState.answers.push(isCorrect);

  if (quizState.currentIdx + 1 < quizState.questions.length) {
    quizState.currentIdx++;
    renderQuestion();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  const correct = quizState.answers.filter(a => a).length;
  const total = quizState.questions.length;
  const score = Math.round((correct / total) * 100);
  const passed = score >= 70;

  // Update progress
  const prev = state.progress[quizState.topicId] || { passed: false, bestScore: null, attempts: 0 };
  prev.attempts = (prev.attempts || 0) + 1;
  if (prev.bestScore === null || score > prev.bestScore) prev.bestScore = score;
  if (passed) prev.passed = true;
  state.progress[quizState.topicId] = prev;
  saveState();

  updateLeaderboard();
  showResult(score, passed, prev.bestScore);
}

function showResult(score, passed, bestScore) {
  const icon = document.getElementById('result-icon');
  const title = document.getElementById('result-title');
  const msg = document.getElementById('result-msg');
  const pb = document.getElementById('result-pb');
  const ring = document.getElementById('ring-fill');
  const scoreNum = document.getElementById('result-score-num');
  const retryBtn = document.getElementById('btn-retry');

  icon.className = 'result-icon ' + (passed ? 'pass' : 'fail');
  icon.textContent = passed ? '🎉' : '💪';
  title.className = 'result-title ' + (passed ? 'pass' : 'fail');
  title.textContent = passed ? 'Topic Mastered!' : 'Keep Going!';
  msg.textContent = passed
    ? 'Excellent work — this topic is now marked as completed.'
    : 'Reattempt required to achieve mastery. You\'re almost there!';

  scoreNum.textContent = score + '%';
  pb.textContent = bestScore != null ? '⭐ Personal Best: ' + bestScore + '%' : '';

  const circumference = 326.7;
  const offset = circumference - (score / 100) * circumference;
  ring.className = 'ring-fill ' + (passed ? 'pass' : 'fail');
  ring.style.strokeDashoffset = circumference;
  setTimeout(() => { ring.style.strokeDashoffset = offset; }, 100);

  retryBtn.style.display = passed ? 'block' : 'block';
  retryBtn.textContent = passed ? 'Reattempt to Improve' : 'Try Again';

  showScreen('result');
}

function retryTopic() {
  startTopic(quizState.topicId);
}

function backToDashboard() {
  showDashboard();
}

// ---- LEADERBOARD ----
function updateLeaderboard() {
  let lb = [];
  try { lb = JSON.parse(localStorage.getItem('pharmamastery_lb') || '[]'); } catch(e) {}

  const coreTopics = TOPICS.filter(t => !t.opOnly);
  let scoreSum = 0, scoreCt = 0, completedCt = 0;
  for (const t of coreTopics) {
    const p = state.progress[t.id];
    if (p && p.bestScore != null) { scoreSum += p.bestScore; scoreCt++; }
    if (p && p.passed) completedCt++;
  }
  const avg = scoreCt > 0 ? Math.round(scoreSum / scoreCt) : 0;

  const existing = lb.findIndex(e => e.name === state.name);
  const entry = { name: state.name, avg, completed: completedCt };
  if (existing >= 0) lb[existing] = entry;
  else lb.push(entry);
  lb.sort((a,b) => b.avg - a.avg || b.completed - a.completed);

  localStorage.setItem('pharmamastery_lb', JSON.stringify(lb));
}

function showLeaderboard() {
  let lb = [];
  try { lb = JSON.parse(localStorage.getItem('pharmamastery_lb') || '[]'); } catch(e) {}

  const list = document.getElementById('lb-list');
  if (lb.length === 0) {
    list.innerHTML = '<div class="lb-empty">No rankings yet. Complete some topics to appear here!</div>';
  } else {
    list.innerHTML = '';
    lb.slice(0, 20).forEach((entry, i) => {
      const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
      const rankLabel = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i+1);
      const isMe = entry.name === state.name;
      const row = document.createElement('div');
      row.className = 'lb-row';
      row.innerHTML = `
        <div class="lb-rank ${rankClass}">${rankLabel}</div>
        <div>
          <div class="lb-name ${isMe ? 'me' : ''}">${entry.name}${isMe ? ' (You)' : ''}</div>
          <div class="lb-topics">${entry.completed} core topics completed</div>
        </div>
        <div class="lb-score">${entry.avg}%</div>
      `;
      list.appendChild(row);
    });
  }
  showScreen('leaderboard');
}

// ---- INIT ----
loadState();
if (state.name && state.role) {
  selectedRole = state.role;
  showDashboard();
} else {
  showScreen('login');
}
</script>
